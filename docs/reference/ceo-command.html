<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEO Command Room</title>
<style>
  :root { --bg: #03050b; --cyan: #5fd8ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 16px; bottom: 14px; color: var(--cyan);
    font: 600 11px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .18em;
    opacity: .7; pointer-events: none; text-shadow: 0 0 8px rgba(95,216,255,.7);
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="hud">STRATEGY COMMAND // DRAG TO ORBIT</div>
<script>
const TABLE_H = 0.95, TABLE_R = 3, CEO_SCALE = 1.75;
const CEO_CHEST = new THREE.Vector3(0, TABLE_H + 1.25 * CEO_SCALE, 0);
const BLUE = 0x4fb8ff, BLUE_HEX = '#6cc8ff', VIOLET = 0xa05cff;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03050b);
scene.fog = new THREE.FogExp2(0x03050b, 0.028);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 200);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.3, 0);
controls.enableDamping = true;
controls.minPolarAngle = 0.95; controls.maxPolarAngle = 1.6;
controls.enablePan = false;

function fitCamera() {
  const a = innerWidth / innerHeight;
  // Keep the camera inside the room; on narrow screens widen the FOV instead of backing out.
  let d = 10.5, fov = 48;
  if (a < 1.25) { d = 11.5; fov = Math.min(80, THREE.MathUtils.radToDeg(2 * Math.atan(5.0 / d / a))); }
  camera.position.set(0, 2.7, d);
  camera.fov = fov; camera.aspect = a; camera.updateProjectionMatrix();
  controls.minDistance = d * 0.6; controls.maxDistance = d * 1.4;
}
fitCamera();

scene.add(new THREE.AmbientLight(0x4060ff, 0.3));
const key = new THREE.PointLight(0x5fd8ff, 2.4, 14); key.position.set(0, 4, 1.5); scene.add(key);
const rim = new THREE.PointLight(0x3a7bff, 1.8, 18); rim.position.set(0, 6, -6); scene.add(rim);

// ---------- helpers ----------
const dotTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

function pointsMat(color, size, opacity = 0.9) {
  return new THREE.PointsMaterial({ color, size, map: dotTex, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
}
const additive = (opts) => new THREE.MeshBasicMaterial(Object.assign({ transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }, opts));

function ring(r1, r2, color, opacity, y, arc = Math.PI * 2) {
  const m = new THREE.Mesh(new THREE.RingGeometry(r1, r2, 96, 1, 0, arc), additive({ color, opacity }));
  m.rotation.x = -Math.PI / 2; m.position.y = y; return m;
}

// Sample points over a capsule-ish segment from a to b.
function seg(arr, a, b, r, n, sx = 1, sz = 1) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const dir = B.clone().sub(A).normalize();
  const u = new THREE.Vector3().crossVectors(dir, Math.abs(dir.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0)).normalize();
  const v = new THREE.Vector3().crossVectors(dir, u);
  for (let i = 0; i < n; i++) {
    const p = A.clone().lerp(B, Math.random()), ang = Math.random() * Math.PI * 2;
    const rr = r * (Math.random() < 0.2 ? Math.random() : 0.85 + Math.random() * 0.15);
    const o = u.clone().multiplyScalar(Math.cos(ang) * rr).add(v.clone().multiplyScalar(Math.sin(ang) * rr));
    o.x *= sx; o.z *= sz; p.add(o); arr.push(p.x, p.y, p.z);
  }
}

// Humanoid particle figure facing +z. Standing: feet at y=0. Seated: seat at y~0.5.
function makeFigure(color, density, size, seated = false) {
  const group = new THREE.Group(), body = [], head = [], k = density;
  if (!seated) {
    seg(body, [0, 0.98, 0], [0, 1.42, 0], 0.19, 900 * k, 1.25, 0.65);
    seg(body, [0, 1.42, 0], [0, 1.5, 0], 0.06, 80 * k);
    seg(body, [-0.25, 1.4, 0], [-0.3, 1.1, 0.02], 0.055, 200 * k);
    seg(body, [0.25, 1.4, 0], [0.3, 1.1, 0.02], 0.055, 200 * k);
    seg(body, [-0.3, 1.1, 0.02], [-0.33, 0.82, 0.08], 0.045, 160 * k);
    seg(body, [0.3, 1.1, 0.02], [0.33, 0.82, 0.08], 0.045, 160 * k);
    seg(body, [-0.1, 0.98, 0], [-0.12, 0.5, 0], 0.075, 260 * k);
    seg(body, [0.1, 0.98, 0], [0.12, 0.5, 0], 0.075, 260 * k);
    seg(body, [-0.12, 0.5, 0], [-0.13, 0.04, 0.02], 0.055, 220 * k);
    seg(body, [0.12, 0.5, 0], [0.13, 0.04, 0.02], 0.055, 220 * k);
  } else {
    seg(body, [0, 0.56, -0.05], [0, 1.0, -0.1], 0.19, 900 * k, 1.25, 0.65);
    seg(body, [0, 1.0, -0.1], [0, 1.08, -0.1], 0.06, 80 * k);
    seg(body, [-0.25, 0.98, -0.1], [-0.29, 0.72, 0.05], 0.055, 200 * k);
    seg(body, [0.25, 0.98, -0.1], [0.29, 0.72, 0.05], 0.055, 200 * k);
    seg(body, [-0.29, 0.72, 0.05], [-0.24, 0.7, 0.38], 0.045, 160 * k);
    seg(body, [0.29, 0.72, 0.05], [0.24, 0.7, 0.38], 0.045, 160 * k);
    seg(body, [-0.11, 0.56, 0], [-0.13, 0.56, 0.46], 0.075, 260 * k);
    seg(body, [0.11, 0.56, 0], [0.13, 0.56, 0.46], 0.075, 260 * k);
    seg(body, [-0.13, 0.56, 0.46], [-0.14, 0.06, 0.52], 0.055, 220 * k);
    seg(body, [0.13, 0.56, 0.46], [0.14, 0.06, 0.52], 0.055, 220 * k);
  }
  for (let i = 0; i < 520 * k; i++) {
    const t = Math.acos(2 * Math.random() - 1), p = Math.random() * Math.PI * 2;
    const r = 0.115 * (Math.random() < 0.15 ? Math.random() : 1);
    head.push(r * Math.sin(t) * Math.cos(p), 0.16 + r * 1.2 * Math.cos(t), r * Math.sin(t) * Math.sin(p));
  }
  const mat = pointsMat(color, size);
  const toPts = (arr) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); return new THREE.Points(g, mat); };
  group.add(toPts(body));
  const headPivot = new THREE.Group(); headPivot.position.set(0, seated ? 1.05 : 1.47, seated ? -0.1 : 0);
  headPivot.add(toPts(head)); group.add(headPivot);
  return { group, headPivot, mat };
}

// Dark office chair with faint holo edge lines, facing +z (sitter faces +z).
const chairMat = new THREE.MeshStandardMaterial({ color: 0x0a0d18, metalness: 0.6, roughness: 0.45 });
function makeChair(edgeColor = BLUE, edgeOpacity = 0.35) {
  const g = new THREE.Group(), edgeMat = new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity: edgeOpacity });
  const part = (geo, x, y, z, rx = 0) => {
    const m = new THREE.Mesh(geo, chairMat); m.position.set(x, y, z); m.rotation.x = rx; g.add(m);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat); e.position.copy(m.position); e.rotation.x = rx; g.add(e);
  };
  part(new THREE.BoxGeometry(0.62, 0.09, 0.58), 0, 0.46, 0.05);
  part(new THREE.BoxGeometry(0.6, 0.5, 0.07), 0, 0.78, -0.33, -0.12);
  part(new THREE.BoxGeometry(0.06, 0.05, 0.42), -0.34, 0.68, 0.02);
  part(new THREE.BoxGeometry(0.06, 0.05, 0.42), 0.34, 0.68, 0.02);
  part(new THREE.CylinderGeometry(0.04, 0.04, 0.38, 12), 0, 0.22, 0.05);
  part(new THREE.CylinderGeometry(0.3, 0.3, 0.03, 5), 0, 0.03, 0.05);
  return g;
}

function makeLabel(lines, color, w = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = 40 + lines.length * 44 + (lines[0].big ? 24 : 0);
  const g = c.getContext('2d'); g.textAlign = 'center'; g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 6;
  lines.forEach((l, i) => {
    g.font = (i === 0 ? '700 ' + (l.big ? 64 : 34) : '500 26') + 'px "Segoe UI", Helvetica, Arial, sans-serif';
    g.fillStyle = i === 0 ? '#ffffff' : color;
    g.fillText(l.text, w / 2, 52 + i * 42 + (lines[0].big && i > 0 ? 24 : 0));
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  s.scale.set(c.width / 230, c.height / 230, 1); return s;
}

// ---------- room ----------
const walls = new THREE.Mesh(new THREE.CylinderGeometry(13, 13, 12, 64, 1, true),
  new THREE.MeshStandardMaterial({ color: 0x070a16, side: THREE.BackSide, metalness: 0.4, roughness: 0.7 }));
walls.position.y = 5; scene.add(walls);
for (let i = 0; i < 16; i++) {
  const a = i / 16 * Math.PI * 2, strip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 3.5, 0.05),
    new THREE.MeshBasicMaterial({ color: i % 4 === 0 ? VIOLET : 0x2f8fff }));
  strip.position.set(Math.sin(a) * 12.7, 3, Math.cos(a) * 12.7); scene.add(strip);
}
// ceiling: blue ring and short violet light bars like a spaceship deck
const ceil = new THREE.Mesh(new THREE.TorusGeometry(6.5, 0.03, 8, 128), new THREE.MeshBasicMaterial({ color: 0x3fc8ff }));
ceil.rotation.x = Math.PI / 2; ceil.position.y = 8; scene.add(ceil);
for (let i = 0; i < 18; i++) {
  const a = i / 18 * Math.PI * 2, bar = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.04, 0.04), new THREE.MeshBasicMaterial({ color: i % 2 ? VIOLET : 0x3fa8ff }));
  bar.position.set(Math.sin(a) * 9.5, 8.6, Math.cos(a) * 9.5); bar.rotation.y = a + Math.PI / 2; scene.add(bar);
}
const floor = new THREE.Mesh(new THREE.CircleGeometry(13, 64), new THREE.MeshStandardMaterial({ color: 0x04060c, metalness: 0.3, roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
for (let r = 5; r < 13; r += 1.6) scene.add(ring(r, r + 0.015, 0x2a5cff, 0.25, 0.005));

// ---------- table ----------
const table = new THREE.Mesh(new THREE.CylinderGeometry(TABLE_R, TABLE_R + 0.2, TABLE_H, 72),
  new THREE.MeshStandardMaterial({ color: 0x0a0d1a, metalness: 0.75, roughness: 0.3 }));
table.position.y = TABLE_H / 2; scene.add(table);
const edge = new THREE.Mesh(new THREE.TorusGeometry(TABLE_R, 0.022, 8, 128), new THREE.MeshBasicMaterial({ color: 0x5fd8ff }));
edge.rotation.x = Math.PI / 2; edge.position.y = TABLE_H; scene.add(edge);
const spinRings = [];
[[0.3, 0.35, 0x8fe4ff, 0.95], [0.5, 0.54, 0x5fd8ff, 0.8], [0.72, 0.77, 0x5fd8ff, 0.7], [0.95, 0.99, 0x3fa8ff, 0.6],
 [1.25, 1.31, 0xb070ff, 0.85], [1.6, 1.62, 0x5fd8ff, 0.4], [2.15, 2.18, 0x3fa8ff, 0.35]].forEach(([a, b, c, o], i) => {
  const m = ring(a, b, c, o, TABLE_H + 0.01 + i * 0.002, i % 2 === 0 ? Math.PI * 1.6 : Math.PI * 2);
  spinRings.push(m); scene.add(m);
});
scene.add(ring(0, 1.0, 0x1f6fff, 0.25, TABLE_H + 0.008));
// light column rising from the table center through the CEO
const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.9, 4.6, 48, 1, true), additive({ color: 0x3fa8ff, opacity: 0.08 }));
beam.position.y = TABLE_H + 2.3; scene.add(beam);

// ---------- holo screen textures ----------
function chartTexture(color) {
  const c = document.createElement('canvas'); c.width = 384; c.height = 240;
  const g = c.getContext('2d'); g.strokeStyle = color; g.fillStyle = color;
  g.globalAlpha = 0.1; g.fillRect(6, 6, 372, 228); g.globalAlpha = 0.9; g.lineWidth = 2; g.strokeRect(6, 6, 372, 228);
  g.globalAlpha = 0.18; g.lineWidth = 1;
  for (let x = 30; x < 370; x += 34) { g.beginPath(); g.moveTo(x, 20); g.lineTo(x, 200); g.stroke(); }
  for (let y = 30; y < 200; y += 28) { g.beginPath(); g.moveTo(14, y); g.lineTo(370, y); g.stroke(); }
  g.globalAlpha = 0.95; g.shadowColor = color; g.shadowBlur = 6;
  const kind = Math.random();
  if (kind < 0.55) {                    // jagged market line
    g.lineWidth = 2.5; g.beginPath(); let y = 120;
    for (let x = 16; x < 370; x += 4) { y = Math.max(28, Math.min(195, y + (Math.random() - 0.5) * 18)); g.lineTo(x, y); }
    g.stroke();
  } else if (kind < 0.8) {              // candlesticks
    let y = 110;
    for (let x = 22; x < 366; x += 12) {
      const o = y, cl = Math.max(35, Math.min(185, y + (Math.random() - 0.5) * 30)), hi = Math.min(o, cl) - Math.random() * 12, lo = Math.max(o, cl) + Math.random() * 12;
      g.fillRect(x + 3, hi, 1.5, lo - hi); g.fillRect(x, Math.min(o, cl), 7, Math.max(2, Math.abs(cl - o))); y = cl;
    }
  } else {                              // data table
    for (let y = 26; y < 196; y += 13) { g.fillRect(18, y, 70, 4); g.fillRect(110, y, 40 + Math.random() * 60, 4); g.fillRect(260, y, 30 + Math.random() * 80, 4); }
  }
  g.globalAlpha = 0.7; for (let x = 20; x < 360; x += 9) g.fillRect(x, 216, 5, 4 + Math.random() * 6);
  return new THREE.CanvasTexture(c);
}
const flicker = [];

// Wall of chart screens behind the CEO
for (let row = 0; row < 3; row++) {
  for (let col = 0; col < 8; col++) {
    const a = THREE.MathUtils.degToRad(130 + col * (100 / 7)), R = 7.6, y = 1.6 + row * 1.45;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1.95, 1.22), additive({ map: chartTexture(Math.random() < 0.85 ? '#5fc8ff' : '#a98bff'), opacity: 0.6 }));
    m.position.set(Math.sin(a) * R, y, Math.cos(a) * R); m.lookAt(0, y, 0);
    m.userData.base = 0.42 + Math.random() * 0.15; m.userData.phase = Math.random() * 10;
    flicker.push(m); scene.add(m);
  }
}
// Dashboards laid on the table rim
for (let i = 0; i < 10; i++) {
  const a = i / 10 * Math.PI * 2 + 0.3, R = 2.45;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.5), additive({ map: chartTexture('#5fc8ff'), opacity: 0.6 }));
  m.position.set(Math.sin(a) * R, TABLE_H + 0.03, Math.cos(a) * R);
  m.rotation.order = 'YXZ'; m.rotation.y = a; m.rotation.x = -Math.PI / 2 + 0.25;
  m.userData.base = 0.55; m.userData.phase = Math.random() * 10; flicker.push(m); scene.add(m);
}
// Executive summary panel on the front of the table
{
  const c = document.createElement('canvas'); c.width = 512; c.height = 220;
  const g = c.getContext('2d'); g.strokeStyle = g.fillStyle = '#6cc8ff'; g.lineWidth = 3;
  g.globalAlpha = 0.12; g.fillRect(4, 4, 504, 212); g.globalAlpha = 1; g.strokeRect(4, 4, 504, 212);
  g.textAlign = 'center'; g.fillStyle = '#ffffff'; g.font = '700 30px "Segoe UI", Arial, sans-serif'; g.fillText('EXECUTIVE SUMMARY', 256, 50);
  g.fillStyle = '#6cc8ff'; g.font = '500 18px "Segoe UI", Arial, sans-serif'; g.fillText('SYNTHESIZING REAL-TIME INPUTS', 256, 78);
  g.lineWidth = 2; g.beginPath();
  for (let x = 30; x < 482; x += 3) g.lineTo(x, 150 + Math.sin(x * 0.09) * 18 * Math.sin(x * 0.013) + (Math.random() - 0.5) * 22);
  g.stroke();
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.69), additive({ map: new THREE.CanvasTexture(c), opacity: 0.95 }));
  m.position.set(0, TABLE_H + 0.32, TABLE_R - 0.15); m.rotation.x = -0.35; scene.add(m);
}

// ---------- CEO: full body, standing on the table ----------
const ceo = makeFigure(0x6fdcff, 6, 0.032);
ceo.group.scale.setScalar(CEO_SCALE); ceo.group.position.y = TABLE_H + 0.02; scene.add(ceo.group);
const rainN = 700, rainGeo = new THREE.BufferGeometry(), rainPos = new Float32Array(rainN * 3);
for (let i = 0; i < rainN; i++) { const a = Math.random() * 6.28, r = Math.sqrt(Math.random()) * 0.85;
  rainPos.set([Math.cos(a) * r, Math.random() * 4.4, Math.sin(a) * r], i * 3); }
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.Points(rainGeo, pointsMat(0x6fd4ff, 0.035, 0.5)); rain.position.y = TABLE_H; scene.add(rain);
const ceoLabel = makeLabel([{ text: 'CEO AI', big: true }, { text: 'STRATEGIC OVERSIGHT' }, { text: 'GLOBAL OPERATIONS' }, { text: 'DECISION AUTHORITY' }], '#a8e6ff');
ceoLabel.position.set(0, TABLE_H + 2.0, 0.9); ceoLabel.scale.multiplyScalar(0.6); scene.add(ceoLabel);

// ---------- agents: seated in chairs, turned to look up at the CEO ----------
const AGENTS = [
  ['DATA ANALYST AGENT', 'Processing Insights', -88],
  ['RESEARCH AGENT', 'Market Intelligence', -132],
  ['FINANCE AGENT', 'Risk & Forecasting', -42],
  ['OPERATIONS AGENT', 'Workflow Optimization', 132],
  ['HR AGENT', 'Talent & Culture', 88],
  ['STRATEGY AGENT', 'Scenario Planning', 42],
];
const agents = [], streams = [];
AGENTS.forEach(([name, sub, deg], i) => {
  const a = THREE.MathUtils.degToRad(deg), R = TABLE_R + 0.75;
  const pos = new THREE.Vector3(Math.sin(a) * R, 0, Math.cos(a) * R);
  const seat = new THREE.Group(); seat.position.copy(pos); seat.lookAt(0, 0, 0);
  seat.add(makeChair());
  const f = makeFigure(BLUE, 1.6, 0.026, true);
  f.headPivot.rotation.x = -0.75;                     // looking up at the CEO
  f.phase = i * 1.3; seat.add(f.group); scene.add(seat); agents.push(f);
  const pad = ring(0.45, 0.5, 0x3fa8ff, 0.4, 0.01); pad.position.x = pos.x; pad.position.z = pos.z; scene.add(pad);
  const lbl = makeLabel([{ text: name }, { text: sub }, { text: '● Live Feed' }], BLUE_HEX);
  lbl.position.set(pos.x * 1.08, [2.05, 2.75, 1.8][Math.floor(i % 3)] , pos.z * 1.08); lbl.scale.multiplyScalar(0.5); scene.add(lbl);

  const start = pos.clone().add(new THREE.Vector3(0, 0.85, 0));
  const mid = start.clone().lerp(CEO_CHEST, 0.5).add(new THREE.Vector3(0, 1.0, 0));
  const curve = new THREE.CatmullRomCurve3([start, mid, CEO_CHEST]);
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(60)),
    new THREE.LineBasicMaterial({ color: 0x4fa8ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending })));
  const n = 18, g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const pts = new THREE.Points(g, pointsMat(0xa8e0ff, 0.085)); scene.add(pts);
  streams.push({ curve, pts, n, speed: 0.12 + Math.random() * 0.06 });
});

// ---------- foreground: human operator in a chair, seen from behind ----------
{
  const op = new THREE.Group(), dark = new THREE.MeshStandardMaterial({ color: 0x020307, metalness: 0.3, roughness: 0.8 });
  const add = (geo, x, y, z) => { const m = new THREE.Mesh(geo, dark); m.position.set(x, y, z); op.add(m); return m; };
  add(new THREE.BoxGeometry(0.85, 0.8, 0.14), 0, 0.95, 0.12);             // chair back, below the shoulders
  add(new THREE.BoxGeometry(0.95, 0.12, 0.85), 0, 0.5, -0.3);           // seat
  add(new THREE.CylinderGeometry(0.06, 0.06, 0.45, 12), 0, 0.22, -0.3);
  const torso = add(new THREE.CylinderGeometry(0.36, 0.27, 0.8, 20), 0, 1.25, -0.18); torso.scale.z = 0.7;
  add(new THREE.SphereGeometry(0.17, 24, 16), 0, 1.86, -0.2).scale.y = 1.15;
  add(new THREE.SphereGeometry(0.15, 16, 12), -0.36, 1.56, -0.18);       // shoulders
  add(new THREE.SphereGeometry(0.15, 16, 12), 0.36, 1.56, -0.18);
  add(new THREE.CylinderGeometry(0.07, 0.08, 0.16, 12), 0, 1.7, -0.2);   // neck
  op.position.set(0, -0.55, TABLE_R + 4.3); op.scale.setScalar(1.3); scene.add(op);
}

// ---------- post ----------
let composer = null;
try {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.95, 0.5, 0.2));
} catch (e) { composer = null; }

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); if (composer) composer.setSize(innerWidth, innerHeight); fitCamera();
});

// ---------- loop ----------
const clock = new THREE.Clock();
(function tick() {
  const t = clock.getElapsedTime();
  ceo.group.position.y = TABLE_H + 0.02 + Math.sin(t * 0.8) * 0.025;
  ceo.mat.size = 0.032 + Math.sin(t * 2.2) * 0.004;
  beam.material.opacity = 0.045 + Math.sin(t * 1.5) * 0.015;
  for (let i = 0; i < rainN; i++) { let y = rainPos[i * 3 + 1] + 0.012 + (i % 7) * 0.002; if (y > 4.4) y = 0; rainPos[i * 3 + 1] = y; }
  rainGeo.attributes.position.needsUpdate = true;
  spinRings.forEach((m, i) => { m.rotation.z = t * (i % 2 ? -0.15 : 0.25) * (1 + i * 0.1); });
  agents.forEach((f) => { f.headPivot.rotation.x = -0.75 + Math.sin(t * 0.7 + f.phase) * 0.04; f.mat.opacity = 0.8 + Math.sin(t * 3 + f.phase) * 0.12; });
  streams.forEach((s) => {
    const arr = s.pts.geometry.attributes.position.array;
    for (let j = 0; j < s.n; j++) { const p = s.curve.getPoint((t * s.speed + j / s.n) % 1); arr[j * 3] = p.x; arr[j * 3 + 1] = p.y; arr[j * 3 + 2] = p.z; }
    s.pts.geometry.attributes.position.needsUpdate = true;
  });
  flicker.forEach((m) => { const p = m.userData.phase; m.material.opacity = m.userData.base + Math.sin(t * 2 + p) * 0.06 + (Math.sin(t * 17 + p * 3) > 0.97 ? -0.3 : 0); });
  controls.update();
  composer ? composer.render() : renderer.render(scene, camera);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
